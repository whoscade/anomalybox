<!DOCTYPE html>
<html>
<head>

  <title>AnomalyBox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="device">
    <div class="faceplate">

          <div class="sub" id="statusLine">awaiting input</div>

      </div>
    </div>
  </div>

  <script src="js/dictionary.js"></script>
  <script src="js/sensors.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
